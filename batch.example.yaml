# A batch: list your tasks once, run them all with ONE command:
#
#     uv run adarubric batch batch.example.yaml
#
# Tasks run one by one, top to bottom. A failing task doesn't stop the rest —
# you get a summary table at the end. Add --dry-run to see the commands
# without running anything.

defaults:              # applied to every task below unless the task overrides it
  harness: gemini-cli
  sandbox: docker
  env_file: .env
  trials: 1

tasks:
  - path: tasks/fix-logging
    sandbox: local             # override: this one runs locally
    harness: claude-code

  - path: dataset/skillsbench/tasks/flood-risk-analysis

  - path: dataset/skillsbench/tasks/lake-warming-attribution
    trials: 3

  - path: tasks/fix-logging
    inject_skills: no          # the control run, skill withheld

  # any run flag works as a key (llm_rubric, adaptive_rubric, timeout, model,
  # instruction, dataset, output ...); for exotic flags use a raw list:
  # - path: dataset/skillsbench/tasks/threejs-to-obj
  #   flags: ["--harness", "acp", "--acp-cmd", "gemini --acp", "--acp-install", "gemini-cli"]
