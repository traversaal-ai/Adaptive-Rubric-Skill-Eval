# SkillsBench wrapper - generated by `adarubric init`. The benchmark task itself
# (instruction, data, Dockerfile, verifier, skills) lives at `source:` and is never
# copied or changed. This file holds only YOUR knobs: which judges run (yes | no |
# a rubric file path), agent, trials, timeout. Flags still win for a single run.
source: ../../dataset/skillsbench/tasks/flood-risk-analysis

defaults:
  # agent: gemini-cli        # uncomment to set a default agent for this task
  trials: 1
timeout: 300

# Run the control condition (skill withheld) with `inject_skills: no`;
# --skill/--no-skill overrides for one run.
# inject_skills: no

# Every scorer that runs, and the exact file each judge reads. The shape differs from a
# self-contained task on purpose: a wrapper cannot list the deterministic check, because the
# benchmark owns it — so the checks come from `source:` and only the judges are yours.
#
#   skillbench_verifier   the dataset's own verifier/ (weight 1.0). Not listed here: it comes with
#                         the task, and `graders:` next to `source:` is a load error by design.
#   static_rubric         THIS task's rubric (weight 0.3 of the reward).
#   fixed_rubric          the BASELINE: one rubric, the same words for every task in the repo.
#   adaptive_rubric       4 task-specific tests, judged blind, each pass quoting its evidence.
#
# Rubrics live under rubrics/<task>/ — every task's, never in the task folder. Each line is
# `yes | no | a path`; a path means "on, judge with exactly this file", and a named file that is
# missing is a load error, not a silent fallback. fixed and adaptive score at weight 0: recorded
# and shown, never blended. Flags (--llm-rubric no ...) still win for one run.
grading:
  static_rubric: ../../rubrics/flood-risk-analysis/static.md
  fixed_rubric: ../../rubrics/fixed.md
  adaptive_rubric: ../../rubrics/flood-risk-analysis/adaptive.json
