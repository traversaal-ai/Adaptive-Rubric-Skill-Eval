# SkillsBench wrapper - generated by `adarubric init`. The benchmark task itself
# (instruction, data, Dockerfile, verifier, skills) lives at `source:` and is never
# copied or changed. This file holds only YOUR knobs: every scorer listed below with
# an explicit include (yes = runs, no = off). Flags still win for a single run.
source: ../../dataset/skillsbench/tasks/flood-risk-analysis

defaults:
  # agent: gemini-cli        # uncomment to set a default agent for this task
  trials: 1
timeout: 300

# Run the control condition (skill withheld) with `inject_skills: no`;
# --skill/--no-skill overrides for one run.
# inject_skills: no

# Every scorer, visible. The verifier's code comes with the dataset (it cannot be redefined
# here - only switched); the judges read the rubric files named below, which live under
# rubrics/ and are yours to edit. fixed and adaptive score at weight 0: recorded and shown,
# never blended into the reward. Flags (--llm-rubric no ...) still win for one run.
graders:
  - type: skillbench_verifier   # the benchmark's own checks (staged AFTER the run)
    include: yes
    weight: 0.7

  - type: llm_rubric            # static judge: this task's generated rubric
    include: yes
    weight: 0.3
    rubric: ../../rubrics/flood-risk-analysis/static.md

  - type: fixed_rubric          # baseline judge: same rubric for every task
    include: yes
    weight: 0.0
    rubric: ../../rubrics/fixed.md

  - type: adaptive_rubric       # 4 task-specific tests, judged blind
    include: yes
    weight: 0.0
    rubric: ../../rubrics/flood-risk-analysis/adaptive.json
