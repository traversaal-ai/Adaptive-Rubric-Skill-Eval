# SkillsBench wrapper - generated by `adarubric init`. The benchmark task itself
# (instruction, data, Dockerfile, verifier, skills) lives at `source:` and is never
# copied or changed. This file holds only YOUR knobs: which judges run (yes | no |
# a rubric file path), agent, trials, timeout. Flags still win for a single run.
source: ../../dataset/skillsbench/tasks/flood-risk-analysis

defaults:
  # agent: gemini-cli        # uncomment to set a default agent for this task
  trials: 1
timeout: 300

# Run the control condition (skill withheld) with `inject_skills: no`;
# --inject-skills overrides for one run.
# inject_skills: no

# Which LLM judges run (yes | no | a rubric file path). This yaml is the source of
# truth; --llm-rubric / --adaptive-rubric override for one run without editing it.
grading:
  static_rubric: ../../rubrics/flood-risk-analysis/static.md
  adaptive_rubric: ../../rubrics/flood-risk-analysis/adaptive.json
