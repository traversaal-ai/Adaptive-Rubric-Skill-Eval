# A code-fixing task. This shape (one config file) is what you need when the agent must start with
# files already in the workspace — the plain TASK.md + grader.yaml folder can't ship those.
#
# The agent gets orders.py (full of print statements) and applog.py (the house logger).
# It does NOT get this file, or the skills/ folder's own control files.

# Fallbacks for when the command line doesn't say. Precedence: CLI flag > this block > built-ins,
# so `--harness codex --trials 5` overrides both lines.
defaults:
  agent: gemini-cli
  trials: 1

instruction: |
  orders.py is full of leftover print statements from debugging. Clean it up.

  Keep the program working: `python orders.py` must still run without errors.

# Files copied into the workspace before the agent starts. Left side is relative to this file,
# right side is where it lands in the workspace.
workspace:
  - fixtures/orders.py:orders.py
  - fixtures/applog.py:applog.py

timeout: 300

# docker:                        # the container this task runs in - uncomment to
#   base: python:3.12-slim       # change the image (this is the default) or to
#   setup: pip install pandas    # install what your task needs

# Every scorer that runs, in ONE list: what it is, how much of the reward it carries, and the
# exact file it judges from. Nothing is left to a default you would have to know about.
#
#   deterministic     the script check below (weight 0.7). Runs in the finished workspace and
#                     prints {"score": 0..1}.
#   llm_rubric        the STATIC judge: THIS task's rubric (weight 0.3). Together with the check
#                     above, that is the whole reward.
#   fixed_rubric      the BASELINE: one rubric, the same words for every task in the repo. Ours by
#                     default — open it, edit it, it's yours.
#   adaptive_rubric   4 task-specific tests, judged blind, each pass having to quote its evidence.
#
# Rubrics live under rubrics/<task>/ — every task's, never in the task folder — so a `rubric:`
# path here points back out at them. The file must exist; a missing one is a load error, not a
# silent fallback. Weight 0 = scored and shown on the dashboard, never blended into the reward.
#
# --llm-rubric no / --fixed-rubric no / --adaptive-rubric no still switch any of these off for one
# run, and a task that declares no judges at all gets them from a `grading:` block instead.
graders:
  # Runs after the agent is gone, in the finished workspace. Written as a python one-liner so it
  # behaves the same under bash and Windows cmd.
  - type: deterministic
    include: yes
    weight: 0.7
    run: >-
      python -c "import json,os,re,subprocess,sys;
      p='orders.py';
      t=open(p,encoding='utf-8').read() if os.path.exists(p) else '';
      q=chr(39)+chr(34);
      names=re.findall('applog[.]event[(]\s*['+q+']([^'+q+']*)',t);
      r=subprocess.run([sys.executable,p],capture_output=True) if t else None;
      c=[('file-exists',bool(t)),
      ('no-print','print(' not in t),
      ('uses-applog','import applog' in t),
      ('all-four-logged',len(names)>=4),
      ('event-names',bool(names) and all(re.fullmatch('[a-z]+(_[a-z]+)+',n) for n in names)),
      ('still-runs',bool(r) and r.returncode==0)];
      n=sum(1 for _,v in c if v);
      print(json.dumps({'score':round(n/len(c),2),'details':'; '.join(('ok ' if v else 'MISS ')+k for k,v in c)}))"

  - type: llm_rubric
    include: yes
    weight: 0.3
    rubric: ../../rubrics/fix-logging/static.md

  - type: fixed_rubric
    include: yes
    weight: 0.0
    rubric: ../../rubrics/fixed.md

  - type: adaptive_rubric
    include: yes
    weight: 0.0
    rubric: ../../rubrics/fix-logging/adaptive.json
